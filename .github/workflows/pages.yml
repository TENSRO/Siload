# Publishes the bench dashboard (server/static) to GitHub Pages.
# On Pages there is no server.py, so the page reads the XIAO directly over USB (Web Serial, Chrome/Edge).
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["server/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: server/static
      - id: deployment
        uses: actions/deploy-pages@v4
